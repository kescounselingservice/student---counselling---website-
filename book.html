<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session - MindSpace | KES Counselling Service</title>
    <style>
        body {
            background-color: #fdf4f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #ffb5a7;
            padding: 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        nav a {
            padding: 10px 20px;
            color: #6d6875;
            text-decoration: none;
            font-weight: bold;
            background-color: #ffffff;
            border-radius: 20px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #fec8d8;
        }
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #c9ada7;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #9a8c98;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="index.html">Book Session</a>
        <a href="meet-our-counsellors.html">Meet Our Counsellors</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>
    <h1>Book a Counselling Session</h1>
    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="email">Student Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="counselor">Select Counsellor</label>
            <select id="counselor" required>
                <option value="" disabled selected>Select a counsellor</option>
                <option value="Vainavi Ma'am">Vainavi Ma'am</option>
                <option value="Kinnari Ma'am">Kinnari Ma'am</option>
            </select>
        </div>
        <div class="form-group">
            <label for="date">Preferred Date & Time</label>
            <input type="datetime-local" id="date" required>
        </div>
        <div class="form-group">
            <label for="notes">Brief Note</label>
            <textarea id="notes" rows="4"></textarea>
        </div>
        <button type="submit" class="btn" id="submitBtn">Confirm Booking</button>
    </form>
</main>

<script type="module">
    // Check if user is logged in
    document.addEventListener('DOMContentLoaded', () => {
        const loggedInUser = localStorage.getItem('studentEmail');
        if (!loggedInUser) {
            alert('Please log in first to access the booking page.');
            window.location.href = 'index.html';
            return;
        }
        // Prefill the email field if available
        const emailInput = document.getElementById('email');
        if (emailInput) {
            emailInput.value = loggedInUser;
        }
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1P2U0ZDbStQIC5PTuftPDRTQpc6c-c6395",
        authDomain: "student-counselling-c6395.firebaseapp.com",
        projectId: "student-counselling-c6395",
        storageBucket: "student-counselling-c6395.appspot.com",
        messagingSenderId: "095934254300",
        appId: "1:95934254300:web:e4161f9857aab9be3985d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('bookingForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        try {
            await addDoc(collection(db, "bookings"), {
                studentName: document.getElementById('name').value,
                studentEmail: document.getElementById('email').value,
                counselor: document.getElementById('counselor').value,
                bookingTime: document.getElementById('date').value,
                notes: document.getElementById('notes').value,
                status: "pending",
                createdAt: new Date().toISOString()
            });
            alert('Booking request submitted!');
            form.reset();
            window.location.href = './dashboard.html';
        } catch (error) {
            console.error("Error saving booking:", error);
            alert('Failed to save booking.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Confirm Booking';
        }
    });
</script>

</body>
</html>
