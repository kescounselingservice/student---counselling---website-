<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session - MindSpace | KES Counselling Service</title>
    <style>
        body {
            background-color: #fdf4f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #ffb5a7;
            padding: 20px;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            color: #6d6875;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 680px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #b5838d;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #6d6875;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #c9ada7;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #ffffff;
            color: #4a4a4a;
        }
        .btn {
            background-color: #c9ada7;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #b5838d;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        footer {
            background-color: #f4a261;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #4a4a4a;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="book.html">Book Session</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>
    <h1>Book a Counselling Session</h1>
    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="email">Student Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">
        </div>

        <div class="form-group">
            <label for="counselor">Select Counsellor</label>
            <select id="counselor" name="counselor" required>
                <option value="" disabled selected>Choose a counsellor</option>
                <option value="Vainavi Ma'am">Vainavi Ma'am</option>
                <option value="Kinnari Ma'am">Kinnari Ma'am</option>
                <option value="Group Support">Group Support</option>
                <option value="Individual Counselling">Individual Counselling</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Preferred Date &amp; Slot</label>
            <input type="datetime-local" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="notes">Brief Note (Optional)</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Anything you'd like your counsellor to know beforehand..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn">Confirm Booking</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 MindSpace — KES Counselling Service</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
        apiKey: "AIzaSyAvlP2UXDZbStQcISpsTXFtUrDPTG8yRl0",
        authDomain: "student-counselling-c6395.firebaseapp.com",
        projectId: "student-counselling-c6395",
        storageBucket: "student-counselling-c6395.firebasestorage.app",
        messagingSenderId: "959304254300",
        appId: "1:959304254300:web:e4161f9857aa39b8da7799",
        measurementId: "G-NYPXX2PXC9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Populate slots from Schedule.json if available
    document.addEventListener("DOMContentLoaded", () => {
        fetch("Schedule.json")
            .then((response) => (response.ok ? response.json() : null))
            .then((data) => {
                if (!data) return;
                const dateInput = document.getElementById("date");
                if (!dateInput) return;

                const select = document.createElement("select");
                select.id = "date";
                select.name = "date";
                select.required = true;

                const defaultOpt = document.createElement("option");
                defaultOpt.value = "";
                defaultOpt.textContent = "Select an available slot";
                defaultOpt.disabled = true;
                defaultOpt.selected = true;
                select.appendChild(defaultOpt);

                Object.keys(data).forEach((day) => {
                    const slots = Array.isArray(data[day]) ? data[day] : [];
                    if (slots.length === 0) return;

                    const optgroup = document.createElement("optgroup");
                    optgroup.label = day;

                    slots.forEach((slot) => {
                        const option = document.createElement("option");
                        const val = typeof slot === "string" ? `${day} - ${slot}` : slot;
                        option.value = val;
                        option.textContent = val;
                        optgroup.appendChild(option);
                    });

                    select.appendChild(optgroup);
                });

                if (select.options.length > 1) {
                    dateInput.parentNode.replaceChild(select, dateInput);
                }
            })
            .catch((err) => console.error("Schedule load fallback:", err));
    });

    // Handle Form Submission
    const bookingForm = document.getElementById("bookingForm");
    const submitBtn = document.getElementById("submitBtn");

    if (bookingForm) {
        bookingForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = "Saving...";
            submitBtn.disabled = true;

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const counselorSelect = document.getElementById("counselor");
            const counselor = counselorSelect.value;
            const dateEl = document.getElementById("date");
            const bookingTime = dateEl.value;
            const notes = document.getElementById("notes")?.value.trim() || "";

            try {
                await addDoc(collection(db, "bookings"), {
                    studentName: name,
                    studentEmail: email,
                    counselor: counselor,
                    bookingTime: bookingTime,
                    notes: notes,
                    status: "confirmed",
                    createdAt: new Date().toISOString()
                });

                alert("Booking confirmed!");
                bookingForm.reset();
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Error adding booking:", error);
                alert("Failed to save booking. Please check Firebase Firestore rules and try again.");
            } finally {
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    }
</script>

</body>
</html>
