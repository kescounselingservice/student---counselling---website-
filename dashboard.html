<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counsellor Dashboard - MindSpace</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #880e4f;
        }
        .appointment-card {
            border: 1px solid #f8bbd0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            background-color: #fff9f9;
        }
        .appointment-card h3 {
            margin-top: 0;
            color: #c2185b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Counsellor Dashboard</h2>
    <div id="booking-list">Loading appointments...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1P2U0ZDbStQIC5PTuftPDRTQpc6c-c6395",
        authDomain: "student-counselling-c6395.firebaseapp.com",
        projectId: "student-counselling-c6395",
        storageBucket: "student-counselling-c6395.appspot.com",
        messagingSenderId: "095934254300",
        appId: "1:95934254300:web:e4161f9857aab9be3985d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function escapeHTML(str) {
        return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[ch]));
    }

    async function loadDashboard() {
        const bookingList = document.getElementById("booking-list");
        if (!bookingList) return;

        try {
            const querySnapshot = await getDocs(collection(db, "bookings"));

            if (querySnapshot.empty) {
                bookingList.innerHTML = "<p>No appointments scheduled yet.</p>";
                return;
            }

            let html = "";
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const studentName = escapeHTML(data.studentName || "Unknown");
                const bookingTime = escapeHTML(data.bookingTime || "Not specified");
                const counselor = escapeHTML(data.counselor || "Not specified");
                const notes = escapeHTML(data.notes || "");

                html += `
                    <div class="appointment-card">
                        <h3>${studentName}</h3>
                        <p><strong>Counsellor:</strong> ${counselor}</p>
                        <p><strong>Date & Time:</strong> ${bookingTime}</p>
                        <p><strong>Notes:</strong> ${notes}</p>
                    </div>
                `;
            });

            bookingList.innerHTML = html;
        } catch (error) {
            console.error("Error loading appointments:", error);
            bookingList.innerHTML = "<p>Unable to load appointments. Check console for details.</p>";
        }
    }

    loadDashboard();
</script>

</body>
</html>
