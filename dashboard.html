<!-- Ensure this container exists in your HTML body -->
<div id="booking-list">Loading appointments...</div>

<script type="module">
  // Keep your existing Firebase imports and initializeApp / getFirestore(app) setup above,
  // and make sure collection and getDocs are imported from firebase-firestore.js:
  // import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  function escapeHTML(str) {
    return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[ch]));
  }

  async function loadDashboard() {
    const bookingList = document.getElementById("booking-list");
    if (!bookingList) return;

    try {
      const querySnapshot = await getDocs(collection(db, "Appointments"));

      if (querySnapshot.empty) {
        bookingList.innerHTML = "<p>No appointments scheduled yet.</p>";
        return;
      }

      let html = "";
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const studentName = escapeHTML(data["STUDENT NAME"] || "Unknown Student");
        const appointmentTime = escapeHTML(data["APPOINTMENTTIME"] || "Not set");
        const preferredSlot = escapeHTML(data["PREFERREDTIMESLOT"] || "Not set");

        html += `
          <div class="appointment-card" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px;">
            <h3>${studentName}</h3>
            <p><strong>Appointment Time:</strong> ${appointmentTime}</p>
            <p><strong>Preferred Time Slot:</strong> ${preferredSlot}</p>
          </div>
        `;
      });

      bookingList.innerHTML = html;
    } catch (error) {
      console.error("Error loading appointments:", error);
      bookingList.innerHTML = "<p>Unable to load appointments. Check your Firestore permissions.</p>";
    }
  }

  // Call loadDashboard once the page loads (or inside your onAuthStateChanged callback)
  loadDashboard();
</script>
