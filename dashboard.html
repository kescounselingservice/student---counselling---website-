<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MindSpace | KES Counselling Service</title>
    <style>
        body {
            background-color: #fdf4f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #ffb5a7;
            padding: 20px;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            color: #6d6875;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #b5838d;
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h3 {
            color: #b5838d;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            color: #6d6875;
        }
        .booking-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .booking-item:last-child {
            border-bottom: none;
        }
        footer {
            background-color: #f4a261;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #4a4a4a;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="book.html">Book Session</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>
    <h1>Student Dashboard</h1>
    <div class="card">
        <h3>Upcoming Sessions</h3>
        <div id="bookingsList">Loading bookings...</div>
    </div>
</main>

<footer>
    <p>&copy; 2026 MindSpace — KES Counselling Service</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvlP2UXDZbStQcISpsTXFtUrDPTG8yRl0",
        authDomain: "student-counselling-c6395.firebaseapp.com",
        projectId: "student-counselling-c6395",
        storageBucket: "student-counselling-c6395.firebasestorage.app",
        messagingSenderId: "959304254300",
        appId: "1:959304254300:web:06533ac4c1efe5c3da7799"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadBookings() {
        const container = document.getElementById('bookingsList');
        try {
            const querySnapshot = await getDocs(collection(db, "bookings"));
            container.innerHTML = '';
            
            if (querySnapshot.empty) {
                container.innerHTML = '<p>No active bookings. Click below to schedule.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const session = doc.data();
                const status = session.status || 'Booked';
                const counselor = session.counselor || 'N/A';
                const bookingTime = session.bookingTime ? new Date(session.bookingTime).toLocaleString() : 'N/A';

                const item = document.createElement('div');
                item.className = 'booking-item';
                item.innerHTML = `
                    <p><strong>Status:</strong> ${status}</p>
                    <p><strong>Counsellor:</strong> ${counselor}</p>
                    <p><strong>Date & Time:</strong> ${bookingTime}</p>
                `;
                container.appendChild(item);
            });
        } catch (error) {
            console.error("Error loading bookings:", error);
            container.innerHTML = '<p>Error loading bookings.</p>';
        }
    }

    loadBookings();
</script>

</body>
</html>
