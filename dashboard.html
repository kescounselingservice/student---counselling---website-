<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MindSpace | KES Counselling Service</title>
    <style>
        body {
            background-color: #fdf4f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #ffb5a7;
            padding: 20px;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            color: #6d6875;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
        }
        h1 {
            color: #b5838d;
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .booking-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .booking-item:last-child {
            border-bottom: none;
        }
        footer {
            background-color: #f4a261;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #4a4a4a;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="book.html">Book Session</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <h1>Student Dashboard</h1>
        <div class="card">
            <h3>Upcoming Sessions</h3>
            <div id="bookingsList">Loading bookings...</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MindSpace - KES Counselling Service</p>
    </footer>

    <script>
        async function loadBookings() {
            const container = document.getElementById('bookingsList');
            try {
                const response = await fetch('Schedule.json');
                const data = await response.json();
                container.innerHTML = '';
                
                let hasBookings = false;
                if (data.Schedule) {
                    for (const day in data.Schedule) {
                        data.Schedule[day].forEach(session => {
                            if (session.Status === 'Booked') {
                                hasBookings = true;
                                const item = document.createElement('div');
                                item.className = 'booking-item';
                                item.innerHTML = `
                                    <p><strong>Status:</strong> ${session.Status}</p>
                                    <p><strong>Counsellor:</strong> ${session.CounselorIDs ? session.CounselorIDs.join(', ') : 'N/A'}</p>
                                    <p><strong>Date & Time:</strong> ${session.Start}</p>
                                `;
                                container.appendChild(item);
                            }
                        });
                    }
                }
                
                if (!hasBookings) {
                    container.innerHTML = '<p>No active bookings.</p>';
                }
            } catch (error) {
                console.error("Error loading bookings:", error);
                container.innerHTML = '<p>Error loading bookings.</p>';
            }
        }

        loadBookings();
    </script>
</body>
</html>
