<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselor Portal - MindSpace</title>
    <style>
        :root {
            --bg: #fdf6f5;
            --header-bg: #f6b5ac;
            --card-bg: #ffffff;
            --primary: #a67c7c;
            --primary-dark: #8c6464;
            --text: #3d2c2e;
            --muted: #7a6567;
            --border: #ead8d6;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); }
        header { background: var(--header-bg); padding: 16px 20px; text-align: center; }
        header h1 { margin: 0 0 10px; font-size: 1.8rem; color: #fff; }
        nav a { text-decoration: none; color: #5e3a3d; font-weight: 600; margin: 0 10px; font-size: 14px; }
        .container { max-width: 800px; margin: 24px auto; padding: 0 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        h3 { margin-top: 0; color: var(--primary-dark); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-confirmed { background: #d4edda; color: #155724; }
        .detail-row { margin: 6px 0; font-size: 14px; }
        .detail-label { font-weight: 700; color: var(--muted); }
        button { width: 100%; padding: 12px; margin-top: 14px; background: var(--primary); color: #fff; border: none; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--primary-dark); }
        .btn-logout { background: transparent; color: var(--primary-dark); border: 1px solid var(--primary); width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0; }
        .btn-logout:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<header>
    <h1>MindSpace Platform</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="book.html">Book Session</a>
        <a href="dashboard.html">Student Dashboard</a>
    </nav>
</header>

<div class="container">
    <div class="top-bar">
        <div>
            <span style="font-size: 13px; color: var(--muted);">Logged in as:</span>
            <h3 id="counsellorTitle" style="margin: 2px 0 0;">Counselor</h3>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div id="bookingsList">Loading sessions...</div>
</div>

<script>
    const COUNSELLERS = {
        "VAINAVI MAM": { displayName: "Vainavi Ma'am" },
        "KINNARI MAM": { displayName: "Kinnari Ma'am" }
    };

    window.addEventListener("DOMContentLoaded", () => {
        const savedCounsellor = sessionStorage.getItem("activeCounsellor") || localStorage.getItem("activeCounsellor");
        if (savedCounsellor && COUNSELLERS[savedCounsellor]) {
            showDashboard(COUNSELLERS[savedCounsellor].displayName);
        } else {
            window.location.href = "index.html";
        }
    });

    function showDashboard(displayName) {
        document.getElementById("counsellorTitle").textContent = displayName;
        renderBookings(displayName);
    }

    function getBookings() {
        const possibleKeys = ["mindspace_bookings", "bookings", "session_bookings"];
        for (const key of possibleKeys) {
            const data = localStorage.getItem(key);
            if (data) {
                try {
                    return { storageKey: key, list: JSON.parse(data) };
                } catch(e) {
                    console.error("Error parsing storage key", key, e);
                }
            }
        }
        return { storageKey: "mindspace_bookings", list: [] };
    }

    function renderBookings(displayName) {
        const container = document.getElementById("bookingsList");
        const { storageKey, list } = getBookings();
        
        const relevant = list.filter(b => 
            b.counsellor === displayName || 
            b.counsellor === "Group Support" || 
            b.counsellor === "Individual Counselling"
        );

        if (relevant.length === 0) {
            container.innerHTML = '<div class="card"><p>No pending or confirmed sessions found for your queue.</p></div>';
            return;
        }

        container.innerHTML = relevant.map((b, index) => {
            const isPending = (!b.status || b.status === "pending");
            const statusBadge = isPending 
                ? '<span class="badge badge-pending">Pending Approval</span>' 
                : '<span class="badge badge-confirmed">Confirmed</span>';
            
            const actionBtn = isPending 
                ? `<button onclick="approveBooking('${storageKey}', ${index}, '${displayName}')">Approve Session</button>` 
                : '';

            return `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                        <div>
                            <h3 style="margin: 0;">${b.name || b.fullName || 'Student Session'}</h3>
                            <span style="font-size: 13px; color: var(--muted);">${b.email || ''}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    <div class="detail-row"><span class="detail-label">Service:</span> ${b.counsellor}</div>
                    <div class="detail-row"><span class="detail-label">Date & Time:</span> ${b.date} at ${b.time}</div>
                    ${b.notes ? `<div class="detail-row"><span class="detail-label">Notes:</span> ${b.notes}</div>` : ''}
                    ${actionBtn}
                </div>
            `;
        }).join("");
    }

    function approveBooking(storageKey, index, displayName) {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return;
        try {
            const list = JSON.parse(raw);
            if (list[index]) {
                list[index].status = "confirmed";
                list[index].approvedBy = displayName;
                localStorage.setItem(storageKey, JSON.stringify(list));
                renderBookings(displayName);
            }
        } catch(e) {
            console.error("Failed to approve booking", e);
        }
    }

    function logout() {
        sessionStorage.removeItem("activeCounsellor");
        localStorage.removeItem("activeCounsellor");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
