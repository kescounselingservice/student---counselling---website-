 <!DOCTYPE html>
<htmllang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace - Platform Access</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #fdf4f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        header { background-color: #ffb5a7; padding: 20px; text-align: center; color: #a37081; }
        .main-container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center; }
        .portal { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 15px; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #b5e2fa; color: #333; }
        .btn-signup { background-color: #ffcad4; color: #333; }
        footer { background-color: #eee; text-align: center; padding: 10px; margin-top: 40px; color: #777; }
    </style>
</head>
<body>

<header>
    <h1>MindSpace Platform</h1>
</header>

<div class="main-container">
    <div class="portal">
        <h2>Student Portal</h2>
        <form id="studentForm">
            <div class="form-group">
                <label for="studentEmail">Email</label>
                <input type="email" id="studentEmail" required>
            </div>
            <div class="form-group">
                <label for="studentPassword">Password</label>
                <input type="password" id="studentPassword" required>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-login" onclick="handleStudentAuth('login')">Login</button>
                <button type="button" class="btn-signup" onclick="handleStudentAuth('signup')">Sign Up</button>
            </div>
        </form>
    </div>

    <div class="portal">
        <h2>Counselor Portal</h2>
        <form id="counselorForm">
            <div class="form-group">
                <label for="counselorUsername">Username</label>
                <input type="text" id="counselorUsername" required>
            </div>
            <div class="form-group">
                <label for="counselorPassword">Password</label>
                <input type="password" id="counselorPassword" required>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-login" onclick="handleCounselorAuth()">Login</button>
            </div>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 MindSpace Platform</p>
</footer>

<script>
    function handleStudentAuth(action) {
        const email = document.getElementById('studentEmail').value;
        const password = document.getElementById('studentPassword').value;

        if (!email || !password) {
            alert('Please fill in all fields.');
            return;
        }

        if (action === 'signup') {
            localStorage.setItem('studentUser', JSON.stringify({ email, password }));
            alert('Sign up successful! Please log in.');
            document.getElementById('studentForm').reset();
        } else if (action === 'login') {
            const storedUser = JSON.parse(localStorage.getItem('studentUser'));
            if (storedUser && storedUser.email === email && storedUser.password === password) {
                alert('Redirecting to Student Dashboard...');
                window.location.href = 'student-dashboard.html';
            } else {
                alert('Invalid credentials or user not found.');
            }
        }
    }

    function handleCounselorAuth() {
        const username = document.getElementById('counselorUsername').value;
        const password = document.getElementById('counselorPassword').value;

        if (!username || !password) {
            alert('Please fill in all fields.');
            return;
        }

        // Add proper authentication logic here
        localStorage.setItem('activeCounselor', username);
        alert('Redirecting to Counselor Dashboard...');
        window.location.href = 'dashboard.html';
    }
</script>

</body>
</html>
