<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace - Access</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #fdf4f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #ffb5a7; padding: 20px; text-align: center; }
        nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        nav a { padding: 10px 20px; color: #6d6875; text-decoration: none; font-weight: bold; background-color: #ffffff; border-radius: 20px; transition: background-color 0.3s; }
        nav a:hover { background-color: #fec8d8; }
        .main-container { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; flex: 1; }
        .portal { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #b5e2fa; color: #333; }
        .btn-signup { background-color: #ffcad4; color: #333; }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="book.html">Book Session</a>
        <a href="meet-our-counsellors.html">Meet Our Counsellors</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<div class="main-container">
    <div class="portal">
        <h2>Student Portal</h2>
        <form id="studentForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="studentEmail" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="studentPassword" required>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-login" onclick="handleStudentAuth('login')">Login</button>
                <button type="button" class="btn-signup" onclick="handleStudentAuth('signup')">Sign Up</button>
            </div>
        </form>
    </div>

    <div class="portal">
        <h2>Counselor Portal</h2>
        <form id="counselorForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="counselorUsername" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="counselorPassword" required>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-login" onclick="handleCounselorAuth()">Login</button>
            </div>
        </form>
    </div>
</div>

<script>
    function handleStudentAuth(action) {
        const email = document.getElementById('studentEmail').value;
        const password = document.getElementById('studentPassword').value;
        if (!email || !password) {
            alert('Fill all fields.');
            return;
        }
        if (action === 'signup') {
            localStorage.setItem('studentUser', JSON.stringify({ email, password }));
            alert('Signed up! Now log in.');
            document.getElementById('studentForm').reset();
        } else {
            const stored = JSON.parse(localStorage.getItem('studentUser'));
            if (stored && stored.email === email && stored.password === password) {
                localStorage.setItem('studentEmail', email);
                window.location.href = 'book.html';
            } else {
                alert('Invalid student credentials.');
            }
        }
    }

    function handleCounselorAuth() {
        const username = document.getElementById('counselorUsername').value;
        const password = document.getElementById('counselorPassword').value;
        if (!username || !password) {
            alert('Fill all fields.');
            return;
        }
        if (username === 'VAINAVI MAM') {
            window.location.href = 'counsellor.html';
        } else {
            alert('Invalid counselor credentials.');
        }
    }
</script>

</body>
</html>
