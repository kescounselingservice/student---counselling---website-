<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselor Portal - MindSpace</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #fdf4f5; }
        .container { max-width: 800px; margin: auto; }
        .appointment-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; background: white; border-radius: 8px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-accept { background-color: #28a745; color: white; }
        .btn-reschedule { background-color: #ffc107; color: black; }
        .btn-decline { background-color: #dc3545; color: white; }
        .reschedule-section { margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Counselor Dashboard</h1>
        <div id="appointment-list">
            <div class="appointment-card" id="app-1">
                <div>
                    <h3>Student: John Doe</h3>
                    <p>Status: Booked</p>
                    <p>Time: Today at 2:00 PM</p>
                </div>
                <div>
                    <button class="btn-accept" onclick="handleAppointment('1', 'Accepted')">Accept</button>
                    <button class="btn-reschedule" onclick="showRescheduleSection('1')">Reschedule</button>
                    <button class="btn-decline" onclick="handleAppointment('1', 'Declined')">Decline</button>
                </div>
                <div id="reschedule-section-1" class="reschedule-section">
                    <input type="datetime-local" id="new-time-1">
                    <button onclick="submitReschedule('1')">Confirm New Time</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showRescheduleSection(id) {
            document.getElementById(`reschedule-section-${id}`).style.display = 'block';
        }

        function handleAppointment(id, action) {
            const card = document.getElementById(`app-${id}`);
            const statusText = card.querySelector('p');
            if (action === 'Accepted') {
                alert('Appointment accepted.');
                statusText.innerHTML = 'Status: Accepted';
            } else if (action === 'Declined') {
                alert('Appointment declined.');
                statusText.innerHTML = 'Status: Declined';
            }
        }

        function submitReschedule(id) {
            const newTime = document.getElementById(`new-time-${id}`).value;
            if (newTime) {
                alert(`Reschedule request sent for: ${newTime}`);
                document.getElementById(`reschedule-section-${id}`).style.display = 'none';
            } else {
                alert('Please select a valid date and time.');
            }
        }
    </script>
</body>
</html>
